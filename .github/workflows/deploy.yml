name: GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: |
          npx -y -p @larsgw/formica loir-generate-revision-history assets/data/catalog.csv > assets/data/revisions/catalog.json
          npx -y -p @larsgw/formica loir-generate-revision-history assets/data/authors.csv > assets/data/revisions/authors.json
          npx -y -p @larsgw/formica loir-generate-revision-history assets/data/places.csv > assets/data/revisions/places.json
          npx -y -p @larsgw/formica loir-generate-revision-history assets/data/publishers.csv > assets/data/revisions/publishers.json
          npx -y -p @larsgw/formica loir-generate-revision-history assets/data/taxa.csv > assets/data/revisions/taxa.json

      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
